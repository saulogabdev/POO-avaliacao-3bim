spring.application.name=weather

# Banco de dados MySQL (o banco "weather" é criado automaticamente se não existir)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/weather?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA / Hibernate: cria/atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Chave da API do OpenWeatherMap (https://home.openweathermap.org/api_keys)
# Defina a variável de ambiente OPENWEATHER_API_KEY ou troque o valor abaixo.
openweather.api.key=${OPENWEATHER_API_KEY:}

# Datas em português (ex.: "seg 06/10")
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
