<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments :: head('Minhas cidades')}"></head>
<body>
<header th:replace="~{fragments :: menu}"></header>
<main>
    <h1>Minhas cidades</h1>
    <div th:replace="~{fragments :: mensagens}"></div>

    <p><a class="botao" th:href="@{/cidades/nova}">+ Nova cidade</a></p>

    <p th:if="${cidades.isEmpty()}">Nenhuma cidade cadastrada ainda.</p>

    <table th:unless="${cidades.isEmpty()}">
        <thead>
        <tr>
            <th>Nome</th>
            <th>País</th>
            <th>Apelido</th>
            <th>Observação</th>
            <th>Cadastro</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${cidades}">
            <td th:text="${c.nome}"></td>
            <td th:text="${c.pais}"></td>
            <td th:text="${c.apelido}"></td>
            <td th:text="${c.observacao}"></td>
            <td th:text="${c.dataCadastro != null} ? ${#temporals.format(c.dataCadastro, 'dd/MM/yyyy HH:mm')} : ''"></td>
            <td class="acoes">
                <a class="botao" th:href="@{/cidades/{id}/clima(id=${c.id})}">Ver clima</a>
                <a class="botao secundario" th:href="@{/cidades/{id}/editar(id=${c.id})}">Editar</a>
                <form th:action="@{/cidades/{id}/excluir(id=${c.id})}" method="post"
                      onsubmit="return confirm('Excluir esta cidade?');">
                    <button type="submit" class="perigo">Excluir</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
