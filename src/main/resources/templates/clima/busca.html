<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments :: head('Buscar clima')}"></head>
<body>
<header th:replace="~{fragments :: menu}"></header>
<main>
    <h1>Consultar clima</h1>
    <form class="busca" th:action="@{/clima}" method="get">
        <input type="text" name="q" th:value="${q}" placeholder="Ex.: Curitiba ou Paris,FR" required>
        <button type="submit">Buscar</button>
    </form>

    <div th:replace="~{fragments :: mensagens}"></div>

    <div th:if="${clima}">
        <section th:replace="~{fragments :: clima(${clima}, ${previsoes})}"></section>
        <p>
            <a class="botao" th:href="@{/cidades/nova(nome=${clima.cidade}, pais=${clima.pais})}">
                + Salvar esta cidade
            </a>
        </p>
    </div>
</main>
</body>
</html>
